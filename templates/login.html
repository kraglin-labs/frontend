{{define "title"}}Login - SethOfficial{{end}}

{{define "content"}}
<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <h2>Sign In to SethOfficial</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Enter your credentials to access your account.</p>
    
    <form hx-post="/auth/login" hx-target="#login-error" hx-swap="innerHTML">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Email Address</label>
            <input type="email" name="email" required placeholder="sebestianarchibald@gmail.com" style="width: 100%; box-sizing: border-box;">
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Password</label>
            <input type="password" name="password" required placeholder="••••••••" style="width: 100%; box-sizing: border-box;">
        </div>
        
        <button type="submit" style="width: 100%;">Sign In</button>
    </form>

    <!-- Error/Status feedback target for HTMX -->
    <div id="login-error" style="margin-top: 1rem; text-align: center; font-size: 0.9rem;"></div>
</div>
{{end}}
